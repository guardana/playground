project_id: lab
tenant_id: tenant_a
environment: development
listener:
  kind: stateless_http
  principal:
    id: user_123
    tenant_id: tenant_a
  agent:
    id: support-agent
approvals:
  provider: file
  ttl: 3s
  retry_after: 1s
