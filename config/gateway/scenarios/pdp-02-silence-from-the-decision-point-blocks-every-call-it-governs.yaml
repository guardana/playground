# fail_open_read is on so that a read blocked here is blocked by the silence
# alone. The timeout leaves room for the first ask's TLS handshake.
mode: ENFORCE
project_id: lab
tenant_id: tenant_a
environment: development
listener:
  kind: stateless_http
  principal:
    id: user_123
    tenant_id: tenant_a
  agent:
    id: support-agent
policy:
  fail_open_read: true
pdp:
  timeout: 2s
