# What each victim's tools actually do, read from the victims' code and never
# from their annotations, which lie on purpose. The enforcer classifies nothing
# by itself: a tool only this file names is pinned to the definition the
# enforcer's own `doctor` fingerprinted (fingerprints.yaml), and a scenario
# that wants a tool unclassified says so by name.
- { upstream: victim-crm, tool: crm.read_customer, effect: READ, resource_type: customer, resource_from: /customer_id }
- { upstream: victim-crm, tool: crm.update_note, effect: WRITE, resource_type: customer, resource_from: /customer_id }
- { upstream: victim-crm, tool: crm.update_bank_account, effect: WRITE, resource_type: customer, resource_from: /customer_id }
- { upstream: victim-crm, tool: crm.export_table, effect: READ, resource_type: table, resource_from: /table }
- { upstream: victim-db, tool: db.query, effect: READ, resource_type: database }
- { upstream: victim-db, tool: db.execute, effect: WRITE, resource_type: database }
- { upstream: victim-db, tool: db.drop_table, effect: DELETE, resource_type: table, resource_from: /table }
- { upstream: victim-fs, tool: fs.read, effect: READ, resource_type: file, resource_from: /path }
- { upstream: victim-fs, tool: fs.write, effect: WRITE, resource_type: file, resource_from: /path }
- { upstream: victim-fs, tool: fs.list, effect: READ, resource_type: directory, resource_from: /path }
- { upstream: victim-shell, tool: shell.exec, effect: EXECUTE, resource_type: command }
- { upstream: victim-mail, tool: mail.send, effect: COMMUNICATE, resource_type: recipient, resource_from: /to, trust_zone: UNTRUSTED_EXTERNAL }
- { upstream: victim-mail, tool: mail.send_bulk, effect: COMMUNICATE, resource_type: recipient, trust_zone: UNTRUSTED_EXTERNAL }
- { upstream: victim-web, tool: web.fetch, effect: READ, resource_type: url, resource_from: /url, trust_zone: UNTRUSTED_EXTERNAL }
