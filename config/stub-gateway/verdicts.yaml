# What the stub gateway replays when nobody named a scenario: nothing.
#
# `make up` brings the lab up by hand, with no scenario and so no declared
# verdicts. Every call then gets VERDICT_INDETERMINATE with STUB_NO_DECLARED_VERDICT
# and is not forwarded, and the trail records that nobody stated a verdict. An
# empty file that allowed calls would be a lab that passes on silence.
#
# A scenario's own declared verdicts live in config/scenarios/, named for the
# scenario; the runner points LAB_STUB_VERDICTS at the one it is running.
schema_version: 1
project_id: playground
