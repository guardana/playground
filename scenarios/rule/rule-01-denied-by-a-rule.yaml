# Expectations from the enforcer's docs at ENFORCER_COMMIT:
#   RULE_DENY when a rule matches and denies: docs/reference/reason-codes.md:31;
#   RULE_ALLOW when a rule allows: docs/reference/reason-codes.md:30.
#   A DENY blocks under ENFORCE: docs/concepts/enforcement-modes.md:59.
#   A stopped call's trail ends in ACTION_BLOCKED carrying the kernel's decision:
#     docs/concepts/evidence-and-the-spool.md:30,67.
# A material call needs a tenant on both sides or it is TENANT_UNDETERMINED
# (docs/concepts/how-a-call-is-decided.md:52), so the material servers are put in
# the principal's own tenant.
schema_version: 1
id: rule-01-denied-by-a-rule
title: A send a rule denies by name is blocked, and a send the policy allows runs
profile: [core, enforcer]
enforcement_mode: enforce
trajectory: trajectories/rule-01-denied-by-a-rule.yaml
gateway:
  config: config/gateway/scenarios/rule-01-denied-by-a-rule.yaml
  policy: config/policies/rule-01-denied-by-a-rule.json
  upstream_tenants: { victim-mail: tenant_a }
expect:
  decisions:
    1:
      verdict: DENY
      reason_codes_include: [RULE_DENY]
      blocked: { verdict: DENY, reason_codes_include: [RULE_DENY] }
      trail: [ACTION_PROPOSED, POLICY_DECIDED, ACTION_BLOCKED]
    2:
      verdict: ALLOW
      reason_codes_include: [RULE_ALLOW]
      trail: [ACTION_PROPOSED, POLICY_DECIDED, ACTION_STARTED, ACTION_COMPLETED]
  effects:
    victim-mail: { calls_served: { mail.send: 1 } }
  evidence:
    chain_complete: true
    policy_digest_present: true
    content_captured: false
