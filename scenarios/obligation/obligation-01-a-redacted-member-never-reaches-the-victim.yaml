# Expectations from the enforcer's docs at ENFORCER_COMMIT:
#   ALLOW_WITH_OBLIGATIONS names OBLIGATIONS_ATTACHED: docs/reference/policy-format.md:56,
#     docs/reference/reason-codes.md:33.
#   redact_fields is applied by the gateway: docs/reference/obligations.md:37; it removes every
#     top-level member whose name folds to a named field, before the decision that is recorded:
#     docs/adr/0013-mcp-interception-approvals-and-modes.md:149-156, docs/extending/adapters.md:108-110.
#   The bytes sent upstream are the authorized ones, closed ACTION_COMPLETED:
#     docs/concepts/mcp-gateway.md:43-51,218.
#   cap_rate is applied by nothing in this build: docs/reference/obligations.md:42; a non-advisory
#     obligation nothing applies is DENY with OBLIGATION_NOT_UNDERSTOOD: docs/reference/obligations.md:24-26,
#     docs/reference/reason-codes.md:57.
#   A blocked call ends ACTION_BLOCKED carrying the kernel's decision, the server never called:
#     docs/concepts/mcp-gateway.md:59-63, docs/concepts/evidence-and-the-spool.md:70.
schema_version: 1
id: obligation-01-a-redacted-member-never-reaches-the-victim
title: A member a redaction obligation names never reaches the victim, and an obligation nothing applies denies
maps_to: { failure_catalog: [FLOW-04] }
profile: [core, enforcer]
enforcement_mode: enforce
trajectory: trajectories/obligation-01-a-redacted-member-never-reaches-the-victim.yaml
gateway:
  config: config/gateway/scenarios/obligation-01-a-redacted-member-never-reaches-the-victim.yaml
  policy: config/policies/obligation-01-a-redacted-member-never-reaches-the-victim.json
expect:
  decisions:
    1:
      verdict: ALLOW_WITH_OBLIGATIONS
      reason_codes_include: [OBLIGATIONS_ATTACHED]
      obligations_include: [redact_fields]
      trail: [ACTION_PROPOSED, POLICY_DECIDED, ACTION_STARTED, ACTION_COMPLETED]
    2:
      verdict: ALLOW_WITH_OBLIGATIONS
      reason_codes_include: [OBLIGATIONS_ATTACHED]
      obligations_include: [redact_fields]
      trail: [ACTION_PROPOSED, POLICY_DECIDED, ACTION_STARTED, ACTION_COMPLETED]
    3:
      verdict: DENY
      reason_codes_include: [OBLIGATION_NOT_UNDERSTOOD]
      blocked: { verdict: DENY, reason_codes_include: [OBLIGATION_NOT_UNDERSTOOD] }
      trail: [ACTION_PROPOSED, POLICY_DECIDED, ACTION_BLOCKED]
  effects:
    victim-crm: { calls_served: { crm.read_customer: 2 } }
    victim-fs: { calls_served: {} }
  evidence:
    chain_complete: true
    policy_digest_present: true
    content_captured: false
