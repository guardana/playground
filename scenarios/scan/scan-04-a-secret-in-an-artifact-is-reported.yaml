# Expectations from the verifier's documentation at guardana v1.0.0rc5:
#   docs/usage-scan.md:182      the secret scan reads every text file
#   docs/generated/rule-catalog.md:52 hardcoded_secret is HIGH
#   docs/privacy.md:119-121     an AWS key is such a finding, its value redacted
#   docs/profiles.md:14 and docs/exit-codes.md:18-19 the default gate fails at high: exit 1, pass 0
#   docs/usage-scan.md:252      files and findings are named relative to the working directory
# The key is AWS's example shape and leads nowhere; step 1 reads it from the environment.
# Red when: the defect's settings.yaml reads the key from the environment.
schema_version: 1
id: scan-04-a-secret-in-an-artifact-is-reported
title: A secret written into a pipeline file is reported
maps_to: { failure_catalog: [SUP-05] }
profile: [scan]
verifier:
  - scan: { target: artifacts/planted-secret/control }
  - scan: { target: artifacts/planted-secret/defect }
expect:
  verifier:
    1: { exit_code: 0, gate: pass, shortfall: [], errors: [], scope: [settings.yaml], findings: [] }
    2:
      exit_code: 1
      gate: fail
      shortfall: []
      errors: []
      scope: [settings.yaml]
      findings:
        - { rule_id: guardana.supply_chain.hardcoded_secret, severity: HIGH, file: settings.yaml, summary_contains: AWS }
