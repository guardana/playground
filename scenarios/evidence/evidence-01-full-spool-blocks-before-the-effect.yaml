# Expectations from the enforcer's docs at ENFORCER_COMMIT:
#   An ACTION_STARTED reserves closing_reserve, and an append past max_bytes,
#     reservations included, is refused: docs/concepts/evidence-and-the-spool.md:97-100,116-117,
#     docs/reference/configuration.md:76-78.
#   A refused ACTION_STARTED blocks the call before anything runs, with
#     EVIDENCE_UNAVAILABLE, and the block itself is not recorded:
#     docs/concepts/evidence-and-the-spool.md:80, docs/concepts/enforcement-modes.md:81,
#     docs/reference/reason-codes.md:64, docs/reference/mcp-coverage.md:123.
#   Under on_unwritable: block a read is blocked like a material call:
#     docs/concepts/enforcement-modes.md:81, docs/reference/configuration.md:81.
#   /healthz counts blocks by reason code, sink failures before an effect and
#     unrecorded reads under pipeline: docs/guides/run-the-gateway.md:143-150.
# EVIDENCE_UNAVAILABLE is in no trail: the block is unrecorded by design and
# counted only in /healthz, which is graded after the replay: two blocks for
# two refused starts, each a sink failure before the effect, and no read run
# unrecorded. The trail stops at the decision and the servers serve nothing.
# The docs name the counters but not that an unrecorded block or a refused
# start adds one to them; the counts are the lab's reading of the source at the
# pin: internal/gateway/stats.go:11-31 (a block a refused record kept off its
# trail is counted; each append that failed before anything ran is a sink
# failure) and internal/gateway/admit.go:205-220 (one failed append per call).
# A material call needs a tenant on both sides or it is TENANT_UNDETERMINED
# (docs/concepts/how-a-call-is-decided.md:52), so the material servers are put in
# the principal's own tenant.
schema_version: 1
id: evidence-01-full-spool-blocks-before-the-effect
title: With no room to record a start, neither a command nor a read runs
maps_to: { failure_catalog: [EVID-01] }
profile: [core, enforcer]
enforcement_mode: enforce
trajectory: trajectories/evidence-01-full-spool-blocks-before-the-effect.yaml
gateway:
  config: config/gateway/scenarios/evidence-01-full-spool-blocks-before-the-effect.yaml
  policy: config/policies/evidence-01-full-spool-blocks-before-the-effect.json
  upstream_tenants: { victim-shell: tenant_a }
expect:
  decisions:
    1:
      verdict: ALLOW
      reason_codes_include: [RULE_ALLOW]
      trail: [ACTION_PROPOSED, POLICY_DECIDED]
    2:
      verdict: ALLOW
      reason_codes_include: [RULE_ALLOW]
      trail: [ACTION_PROPOSED, POLICY_DECIDED]
  effects:
    victim-shell: { calls_served: {} }
    victim-fs: { calls_served: {} }
  health:
    blocks: { EVIDENCE_UNAVAILABLE: 2 }
    reads_unrecorded: 0
    sink_failures_before_effect: 2
  evidence:
    chain_complete: true
    policy_digest_present: true
    content_captured: false
