# Expectations from the enforcer's docs at ENFORCER_COMMIT:
#   An ACTION_STARTED reserves closing_reserve, and an append past max_bytes,
#     reservations included, is refused: docs/concepts/evidence-and-the-spool.md:101-104,120-121,
#     docs/reference/configuration.md:76-78.
#   A material call whose ACTION_STARTED is refused is blocked before anything
#     runs, and the block is not recorded: docs/concepts/evidence-and-the-spool.md:82,
#     docs/concepts/enforcement-modes.md:83.
#   Under on_unwritable: allow_reads a read runs unrecorded, and its closing
#     event is not attempted: docs/concepts/evidence-and-the-spool.md:83,
#     docs/reference/configuration.md:81.
#   /healthz counts blocks by reason code, sink failures before an effect and
#     unrecorded reads under pipeline: docs/guides/run-the-gateway.md:143-150.
# The block and the unrecorded read are counted only in /healthz, which is
# graded after the replay: one block for the command, one read run unrecorded,
# and both refused starts counted as sink failures before an effect. The trail
# stops at the decision and the listing reaches its server.
# The docs name the counters but not that an unrecorded block or a refused
# start adds one to them; the counts are the lab's reading of the source at the
# pin: internal/gateway/stats.go:11-31 (a block a refused record kept off its
# trail is counted; each append that failed before anything ran is a sink
# failure) and internal/gateway/admit.go:205-220 (one failed append per call).
# A material call needs a tenant on both sides or it is TENANT_UNDETERMINED
# (docs/concepts/how-a-call-is-decided.md:54), so the material servers are put in
# the principal's own tenant.
schema_version: 1
id: evidence-02-full-spool-lets-a-read-run-unrecorded
title: With no room to record a start, a read allowed to run unrecorded runs and a command does not
maps_to: { failure_catalog: [EVID-01] }
profile: [core, enforcer]
enforcement_mode: enforce
trajectory: trajectories/evidence-02-full-spool-lets-a-read-run-unrecorded.yaml
gateway:
  config: config/gateway/scenarios/evidence-02-full-spool-lets-a-read-run-unrecorded.yaml
  policy: config/policies/evidence-02-full-spool-lets-a-read-run-unrecorded.json
  upstream_tenants: { victim-shell: tenant_a }
expect:
  decisions:
    1:
      verdict: ALLOW
      reason_codes_include: [RULE_ALLOW]
      trail: [ACTION_PROPOSED, POLICY_DECIDED]
    2:
      verdict: ALLOW
      reason_codes_include: [RULE_ALLOW]
      trail: [ACTION_PROPOSED, POLICY_DECIDED]
  effects:
    victim-shell: { calls_served: {} }
    victim-fs: { calls_served: { fs.list: 1 } }
  health:
    blocks: { EVIDENCE_UNAVAILABLE: 1 }
    reads_unrecorded: 1
    sink_failures_before_effect: 2
  evidence:
    chain_complete: true
    policy_digest_present: true
    content_captured: false
