# Expectations from the enforcer's docs at ENFORCER_COMMIT:
#   Under LOCKDOWN an allowed material call is blocked with the enforcement
#     point's DENY LOCKDOWN, and POLICY_DECIDED keeps the kernel's ALLOW:
#     docs/concepts/enforcement-modes.md:40-43,56, docs/reference/reason-codes.md:63,
#     docs/reference/mcp-coverage.md:104.
#   An allowed read runs: docs/concepts/enforcement-modes.md:56.
#   A denied read is blocked with the kernel's decision on the block:
#     docs/concepts/enforcement-modes.md:59.
#   A read the policy holds is held: docs/concepts/enforcement-modes.md:58;
#     its trail waits in APPROVAL_REQUESTED: docs/concepts/evidence-and-the-spool.md:28,61.
# A material call needs a tenant on both sides or it is TENANT_UNDETERMINED
# (docs/concepts/how-a-call-is-decided.md:52), so the material servers are put in
# the principal's own tenant.
schema_version: 1
id: mode-02-lockdown-blocks-material-calls
title: Under LOCKDOWN an allowed command is blocked, and reads are decided as the policy says
profile: [core, enforcer]
enforcement_mode: lockdown
trajectory: trajectories/mode-02-lockdown-blocks-material-calls.yaml
gateway:
  config: config/gateway/scenarios/mode-02-lockdown-blocks-material-calls.yaml
  policy: config/policies/mode-02-lockdown-blocks-material-calls.json
  upstream_tenants: { victim-shell: tenant_a }
expect:
  decisions:
    1:
      verdict: ALLOW
      reason_codes_include: [RULE_ALLOW]
      blocked: { verdict: DENY, reason_codes_include: [LOCKDOWN] }
      trail: [ACTION_PROPOSED, POLICY_DECIDED, ACTION_BLOCKED]
    2:
      verdict: ALLOW
      reason_codes_include: [RULE_ALLOW]
      trail: [ACTION_PROPOSED, POLICY_DECIDED, ACTION_STARTED, ACTION_COMPLETED]
    3:
      verdict: DENY
      reason_codes_include: [RULE_DENY]
      blocked: { verdict: DENY, reason_codes_include: [RULE_DENY] }
      trail: [ACTION_PROPOSED, POLICY_DECIDED, ACTION_BLOCKED]
    4:
      verdict: REQUIRE_APPROVAL
      reason_codes_include: [APPROVAL_REQUIRED]
      trail: [ACTION_PROPOSED, POLICY_DECIDED, APPROVAL_REQUESTED]
  effects:
    victim-shell: { calls_served: {} }
    victim-fs: { calls_served: { fs.list: 1 } }
    victim-crm: { calls_served: {} }
  evidence:
    chain_complete: true
    policy_digest_present: true
    content_captured: false
