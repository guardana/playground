# Expectations from the enforcer's docs at ENFORCER_COMMIT:
#   A collector outage is retried for as long as it takes and fills the spool
#     and nothing else: docs/concepts/evidence-and-the-spool.md:118-120.
#   The spool depth falls as the collector acknowledges records:
#     docs/guides/run-the-gateway.md:194-195.
#   RULE_ALLOW and the run call's trail: docs/reference/reason-codes.md:30,
#     docs/concepts/evidence-and-the-spool.md:25-39,65.
#   No argument content in the trail by default: docs/adr/0004-evidence-and-privacy-defaults.md:21.
# The collector is stopped before the replay. The chaos check requires the
# enforcer's /healthz, read before the collector starts again, to show records
# waiting for it; the drain then requires every one handed over with nothing
# lost, and the decisions are graded from the trail that arrived afterwards.
schema_version: 1
id: chaos-03-the-trail-waits-out-a-collector-outage
title: Calls decided while the collector is down reach it whole once it returns
maps_to: { failure_catalog: [EVID-03] }
profile: [core, enforcer]
enforcement_mode: enforce
trajectory: trajectories/chaos-03-the-trail-waits-out-a-collector-outage.yaml
gateway:
  config: config/gateway/scenarios/chaos-03-the-trail-waits-out-a-collector-outage.yaml
  policy: config/policies/chaos-03-the-trail-waits-out-a-collector-outage.json
chaos:
  - collector: down
expect:
  decisions:
    1:
      verdict: ALLOW
      reason_codes_include: [RULE_ALLOW]
      trail: [ACTION_PROPOSED, POLICY_DECIDED, ACTION_STARTED, ACTION_COMPLETED]
    2:
      verdict: ALLOW
      reason_codes_include: [RULE_ALLOW]
      trail: [ACTION_PROPOSED, POLICY_DECIDED, ACTION_STARTED, ACTION_COMPLETED]
  effects:
    victim-crm: { calls_served: { crm.read_customer: 1 } }
    victim-fs: { calls_served: { fs.list: 1 } }
  evidence:
    chain_complete: true
    policy_digest_present: true
    content_captured: false
