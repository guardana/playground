# Expectations from the enforcer's docs at ENFORCER_COMMIT:
#   The manifest is keyed by a fingerprint of the whole definition, so a tool
#     whose description changed is a different tool until it is classified
#     again, and a call to it blocks ACTION_UNCLASSIFIED:
#     docs/adr/0013-mcp-interception-approvals-and-modes.md:114-119,
#     docs/guides/run-the-gateway.md:130-131.
#   An upstream's changed tool list refreshes the manifest:
#     docs/reference/mcp-coverage.md:51. list.ttl is what an agent caches the
#     gateway's own list for, not a re-read of the upstream:
#     docs/reference/mcp-coverage.md:37,50.
#   The block, the kernel's INDETERMINATE and the trail it leaves:
#     docs/concepts/enforcement-modes.md:39-42,77, docs/reference/reason-codes.md:65.
#   RULE_ALLOW: docs/reference/reason-codes.md:30.
# victim-fs describes fs.read anew on its second listing and announces the
# change to every open session. The relist fault is that second listing, made
# from inside victim-fs by a client of its own after the enforcer has listed
# it; fs.list is unchanged and stays classified.
schema_version: 1
id: chaos-04-a-description-changed-under-the-gateway-unclassifies-the-tool
title: A tool whose description changes under the running gateway is blocked as unclassified
maps_to: { failure_catalog: [DRIFT-01] }
profile: [core, enforcer]
enforcement_mode: enforce
trajectory: trajectories/chaos-04-a-description-changed-under-the-gateway-unclassifies-the-tool.yaml
gateway:
  config: config/gateway/scenarios/chaos-04-a-description-changed-under-the-gateway-unclassifies-the-tool.yaml
  policy: config/policies/chaos-04-a-description-changed-under-the-gateway-unclassifies-the-tool.json
chaos:
  - relist: victim-fs
expect:
  decisions:
    1:
      verdict: INDETERMINATE
      blocked: { verdict: INDETERMINATE, reason_codes_include: [ACTION_UNCLASSIFIED] }
      trail: [ACTION_PROPOSED, POLICY_DECIDED, ACTION_BLOCKED]
    2:
      verdict: ALLOW
      reason_codes_include: [RULE_ALLOW]
      trail: [ACTION_PROPOSED, POLICY_DECIDED, ACTION_STARTED, ACTION_COMPLETED]
  effects:
    victim-fs: { calls_served: { fs.list: 1 } }
  evidence:
    chain_complete: true
    policy_digest_present: true
    content_captured: false
