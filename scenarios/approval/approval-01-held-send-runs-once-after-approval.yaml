# Expectations from the enforcer's docs at ENFORCER_COMMIT:
#   A REQUIRE_APPROVAL rule decides with APPROVAL_REQUIRED: docs/reference/policy-format.md:55,
#     docs/reference/reason-codes.md:32; the mail upstream is put in the principal's tenant, since a
#     tenant on one side only is TENANT_UNDETERMINED: docs/reference/reason-codes.md:62.
#   The held call writes ACTION_PROPOSED, POLICY_DECIDED, APPROVAL_REQUESTED:
#     docs/concepts/approvals-and-the-held-call.md:35-38.
#   An approved retry writes no second ACTION_PROPOSED: docs/concepts/mcp-gateway.md:204-207.
#   It consumes the approval once and writes APPROVAL_DECIDED, ACTION_STARTED, then the
#     closing event on the held trail: docs/concepts/approvals-and-the-held-call.md:181,186,200;
#     docs/concepts/evidence-and-the-spool.md:33,35,39.
#   The approver answers each hold it lists once, as its script says, and journals the answer
#     (services/approver/README.md); a retry before an answer is told the same approval_id and
#     makes no new hold: docs/concepts/approvals-and-the-held-call.md:180.
schema_version: 1
id: approval-01-held-send-runs-once-after-approval
title: A mail held for an approval is sent once, on the held trail, after the approver says yes
maps_to: { failure_catalog: [APPR-01] }
profile: [core, enforcer, approvals]
enforcement_mode: enforce
trajectory: trajectories/approval-01-held-send-runs-once-after-approval.yaml
gateway:
  config: config/gateway/scenarios/approval-01-held-send-runs-once-after-approval.yaml
  policy: config/policies/approval-01-held-send-runs-once-after-approval.json
  approver_script: approval-01-held-send-runs-once-after-approval.yaml
  upstream_tenants: { victim-mail: tenant_a }
expect:
  decisions:
    1:
      verdict: REQUIRE_APPROVAL
      reason_codes_include: [APPROVAL_REQUIRED]
    2:
      resumes: 1
      trail: [ACTION_PROPOSED, POLICY_DECIDED, APPROVAL_REQUESTED, APPROVAL_DECIDED, ACTION_STARTED, ACTION_COMPLETED]
  effects:
    victim-mail: { calls_served: { mail.send: 1 } }
    approver: { calls_served: { approve: 1 } }
  evidence:
    chain_complete: true
    policy_digest_present: true
    content_captured: false
