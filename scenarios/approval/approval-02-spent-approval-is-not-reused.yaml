# Expectations from the enforcer's docs at ENFORCER_COMMIT:
#   A REQUIRE_APPROVAL rule decides with APPROVAL_REQUIRED: docs/reference/policy-format.md:55,
#     docs/reference/reason-codes.md:32; the mail upstream is put in the principal's tenant, since a
#     tenant on one side only is TENANT_UNDETERMINED: docs/reference/reason-codes.md:62; POLICY_DECIDED carries the kernel's decision:
#     docs/concepts/evidence-and-the-spool.md:61.
#   The approved retry runs on the held trail: docs/concepts/approvals-and-the-held-call.md:177,196.
#   The next identical call gets a trail of its own, proposed, decided and blocked, with DENY
#     and APPROVAL_ALREADY_USED: docs/concepts/approvals-and-the-held-call.md:198,271-273;
#     docs/reference/reason-codes.md:59; docs/concepts/mcp-gateway.md:200.
#   The approver answers each hold it lists once, as its script says, and journals the answer
#     (services/approver/README.md); a retry before an answer is told the same approval_id and
#     makes no new hold: docs/concepts/approvals-and-the-held-call.md:176.
schema_version: 1
id: approval-02-spent-approval-is-not-reused
title: An approval spent on one send does not let the identical mail be sent again
maps_to: { failure_catalog: [APPR-02] }
profile: [core, enforcer, approvals]
enforcement_mode: enforce
trajectory: trajectories/approval-02-spent-approval-is-not-reused.yaml
gateway:
  config: config/gateway/scenarios/approval-02-spent-approval-is-not-reused.yaml
  policy: config/policies/approval-02-spent-approval-is-not-reused.json
  approver_script: approval-02-spent-approval-is-not-reused.yaml
  upstream_tenants: { victim-mail: tenant_a }
expect:
  decisions:
    1:
      verdict: REQUIRE_APPROVAL
      reason_codes_include: [APPROVAL_REQUIRED]
    2:
      resumes: 1
      trail: [ACTION_PROPOSED, POLICY_DECIDED, APPROVAL_REQUESTED, APPROVAL_DECIDED, ACTION_STARTED, ACTION_COMPLETED]
    3:
      verdict: REQUIRE_APPROVAL
      reason_codes_include: [APPROVAL_REQUIRED]
      blocked: { verdict: DENY, reason_codes_include: [APPROVAL_ALREADY_USED] }
      trail: [ACTION_PROPOSED, POLICY_DECIDED, ACTION_BLOCKED]
  effects:
    victim-mail: { calls_served: { mail.send: 1 } }
    approver: { calls_served: { approve: 1 } }
  evidence:
    chain_complete: true
    policy_digest_present: true
    content_captured: false
