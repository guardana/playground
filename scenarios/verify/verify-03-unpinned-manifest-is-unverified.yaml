# Expectations from the verifier's documentation at guardana v1.0.0rc5:
#   docs/usage-probe.md:103     the verifier never calls a tool, so the victim serves nothing
#   docs/usage-probe.md:210     without a pin drift is reported inconclusive, never clean
#   docs/usage-probe.md:753-756 an inconclusive check is reported under `unverified`
#   docs/usage-probe.md:231     guardana.mcp.unauthenticated_access is low on a private address
#   docs/usage-probe.md:773-775 and docs/profiles.md:119-121 a low finding and unverified results
#                               do not fail the default gate, so the run exits 0
# Red when: the probe is given a pin where none is expected.
schema_version: 1
id: verify-03-unpinned-manifest-is-unverified
title: A manifest probed with no pin is reported unverified, not clean
maps_to: { failure_catalog: [DRIFT-02], owasp_asi: [ASI04] }
profile: [verifier]
verifier:
  - probe: { server: victim-crm }
expect:
  verifier:
    1:
      exit_code: 0
      findings_include:
        - { rule_id: guardana.mcp.unauthenticated_access, severity: LOW }
      unverified_include: [guardana.agent.mcp_server_manifest]
  effects:
    victim-crm: { calls_served: {} }
