# Expectations from the verifier's documentation at guardana v0.26.1:
#   docs/usage-probe.md:48      --write-mcp-pin approves the manifest and exits without reporting
#   docs/usage-probe.md:72      the verifier never calls a tool, so the victim serves nothing
#   docs/usage-probe.md:137-148 a manifest compared with its own pin has not drifted
#   docs/usage-probe.md:162     guardana.mcp.unauthenticated_access is low on a private address
#   docs/usage-probe.md:314-316 and docs/profiles.md:83-85 a low finding and unverified results
#                               do not fail the default gate, so the run exits 0
# victim-crm lies in its annotations, not in its descriptions: its manifest does not change.
# Red when: the probes run against victim-fs, a drifting server, where the
#   stable victim-crm is expected.
schema_version: 1
id: verify-02-stable-manifest-against-its-own-pin
title: A manifest compared with its own pin is reported as not drifted
maps_to: { failure_catalog: [DRIFT-02], owasp_asi: [ASI04] }
profile: [verifier]
verifier:
  - probe: { server: victim-crm, write_pin: true }
  - probe: { server: victim-crm, pin_from: 1 }
expect:
  verifier:
    1: { exit_code: 0 }
    2:
      exit_code: 0
      findings_include:
        - { rule_id: guardana.mcp.unauthenticated_access, severity: LOW }
      findings_exclude: [guardana.agent.mcp_server_manifest]
  effects:
    victim-crm: { calls_served: {} }
