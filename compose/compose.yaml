# The lab's world: the victim tool servers, a page that attacks them, a mail
# sink, the enforcer, the agent, the verifier, the collector the enforcer's
# trail lands on, the decision point double, the approver and the proxy chaos
# scenarios put in front of a victim.
#
# Six networks, all internal: agent-net holds the agent and the enforcer;
# tool-net the enforcer, the victims and what they reach; evidence-net the
# collector and the enforcer; pdp-net the enforcer and the double;
# approver-net the approver alone; trace-net the trace verifier alone. Every
# network is internal, so nothing in the lab has a route out, and the agent can
# reach the enforcer and nothing else. The runner checks the second part from
# inside `agent-net` on every run: the enforcer answers, a victim and the sealed
# addresses do not. It probes no address outside the lab.
#
# A run's records live in its own directory, LAB_RUN_HOST_DIR, and each
# service mounts only the part of it that service writes. By hand (`make up`),
# with no run, that is reports/manual.
#
# Every image name and tag is a variable from versions.env. A tag written here
# would be a second place to change when an upstream moves.
name: guardana-playground

x-lab-env: &lab-env
  # The runner mints the run id. `manual` is what a lab brought up by hand
  # records under, so a hand-run and a scenario run never share a trail.
  LAB_RUN_ID: ${LAB_RUN_ID:-manual}
  LAB_REPORTS_DIR: /reports

x-server-env: &server-env
  <<: *lab-env
  LAB_LISTEN: ":8080"

x-build-args: &build-args
  GO_BUILD_IMAGE: ${GO_BUILD_IMAGE}
  SERVICE_BASE_IMAGE: ${SERVICE_BASE_IMAGE}

# What every lab-built service gets unless something stops it. victim-shell runs
# the shell victim, so these are spelled out rather than assumed: a container
# the agent can get a shell in is not a boundary.
x-hardened: &hardened
  cap_drop: [ALL]
  read_only: true
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

# A victim answers MCP at /mcp and readiness at /healthz on the same listener,
# and writes its journal into journals/<service>/, the one host directory it
# sees: a writer that reached another's directory could rewrite the journal that
# one is graded on. The health check runs the probe that every lab image
# carries, because the runtime base has no shell to run one in.
x-victim: &victim
  <<: *hardened
  networks: [tool-net]
  # `verifier` brings the victims up without the gateway, which lists every
  # victim's tools at startup and would spend the listing a drift is read on.
  profiles: [core, verifier]
  healthcheck:
    test: ["CMD", "/healthprobe", "http://127.0.0.1:8080/healthz"]
    interval: 2s
    timeout: 3s
    retries: 15
    start_period: 2s

services:
  victim-crm:
    image: ${LAB_IMAGE_PREFIX}-victim-crm
    <<: *victim
    build:
      context: ..
      dockerfile: compose/Dockerfile.go-service
      args:
        <<: *build-args
        TARGET: ./victims/crm
    environment:
      <<: *server-env
      LAB_SERVER_NAME: victim-crm
    volumes:
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-../reports/manual}/journals/victim-crm
        target: /reports/${LAB_RUN_ID:-manual}/journals
        bind:
          create_host_path: false

  victim-db:
    image: ${LAB_IMAGE_PREFIX}-victim-db
    <<: *victim
    build:
      context: ..
      dockerfile: compose/Dockerfile.go-service
      args:
        <<: *build-args
        TARGET: ./victims/db
    environment:
      <<: *server-env
      LAB_SERVER_NAME: victim-db
    volumes:
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-../reports/manual}/journals/victim-db
        target: /reports/${LAB_RUN_ID:-manual}/journals
        bind:
          create_host_path: false

  victim-fs:
    image: ${LAB_IMAGE_PREFIX}-victim-fs
    <<: *victim
    build:
      context: ..
      dockerfile: compose/Dockerfile.go-service
      args:
        <<: *build-args
        TARGET: ./victims/fs
    # The fs victim seeds its sandbox from an embedded fixture on every start,
    # so it needs somewhere to write it. A tmpfs keeps the root filesystem read
    # only and throws the sandbox away with the container, which is what
    # "seeded on every start" means.
    tmpfs: [/tmp, /data]
    environment:
      <<: *server-env
      LAB_SERVER_NAME: victim-fs
    volumes:
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-../reports/manual}/journals/victim-fs
        target: /reports/${LAB_RUN_ID:-manual}/journals
        bind:
          create_host_path: false

  victim-shell:
    image: ${LAB_IMAGE_PREFIX}-victim-shell
    <<: *victim
    build:
      context: ..
      dockerfile: compose/Dockerfile.go-service
      args:
        <<: *build-args
        TARGET: ./victims/shell
    environment:
      <<: *server-env
      LAB_SERVER_NAME: victim-shell
    volumes:
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-../reports/manual}/journals/victim-shell
        target: /reports/${LAB_RUN_ID:-manual}/journals
        bind:
          create_host_path: false

  victim-mail:
    image: ${LAB_IMAGE_PREFIX}-victim-mail
    <<: *victim
    build:
      context: ..
      dockerfile: compose/Dockerfile.go-service
      args:
        <<: *build-args
        TARGET: ./victims/mail
    environment:
      <<: *server-env
      LAB_SERVER_NAME: victim-mail
    volumes:
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-../reports/manual}/journals/victim-mail
        target: /reports/${LAB_RUN_ID:-manual}/journals
        bind:
          create_host_path: false
    depends_on:
      mailpit:
        condition: service_healthy

  victim-web:
    image: ${LAB_IMAGE_PREFIX}-victim-web
    <<: *victim
    build:
      context: ..
      dockerfile: compose/Dockerfile.go-service
      args:
        <<: *build-args
        TARGET: ./victims/web
    environment:
      <<: *server-env
      LAB_SERVER_NAME: victim-web
    volumes:
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-../reports/manual}/journals/victim-web
        target: /reports/${LAB_RUN_ID:-manual}/journals
        bind:
          create_host_path: false
    depends_on:
      attacker-web:
        condition: service_healthy

  victim-pay:
    image: ${LAB_IMAGE_PREFIX}-victim-pay
    <<: *victim
    build:
      context: ..
      dockerfile: compose/Dockerfile.go-service
      args:
        <<: *build-args
        TARGET: ./victims/pay
    environment:
      <<: *server-env
      LAB_SERVER_NAME: victim-pay
    volumes:
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-../reports/manual}/journals/victim-pay
        target: /reports/${LAB_RUN_ID:-manual}/journals
        bind:
          create_host_path: false

  # The pages the victims fetch. Catalogued, inert, and on a network with no
  # route out; they exist to be blocked.
  attacker-web:
    image: ${ATTACKER_WEB_IMAGE}
    networks: [tool-net]
    profiles: [core, verifier]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # nginx binds :80 as root and drops its workers to another user, so these
    # four are what stops it starting rather than hardening it can do without.
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    volumes:
      - ../attacks:/usr/share/nginx/html:ro
    healthcheck:
      # An answered request, whatever its status. nginx returning 403 over an
      # empty catalogue is still an nginx that is up, and busybox wget reports
      # every HTTP error as exit 1, so the status line is what is read.
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1/ 2>&1 | grep -q 'HTTP/1.1'"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  # Where victim-mail delivers. Nothing asserts through its API: a scenario
  # reads what victim-mail journalled, not what arrived here.
  mailpit:
    image: ${MAILPIT_IMAGE}
    networks: [tool-net]
    profiles: [core, verifier]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8025/ 2>&1 | grep -q 'HTTP/1.1'"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  # Not in the core profile: the agent is run for one trajectory and exits, so
  # the runner starts it with `docker compose run` and its arguments.
  scripted-agent:
    image: ${LAB_IMAGE_PREFIX}-scripted-agent
    <<: *hardened
    build:
      context: ..
      dockerfile: compose/Dockerfile.go-service
      args:
        <<: *build-args
        TARGET: ./agents/scripted
    networks: [agent-net]
    profiles: [agent]
    volumes:
      - ${LAB_RUN_HOST_DIR:-../reports/manual}/agent:/reports/${LAB_RUN_ID:-manual}/agent
      - type: bind
        source: ${LAB_WORKSPACE:-..}/trajectories
        target: /trajectories
        read_only: true
        bind:
          create_host_path: false
    environment:
      <<: *lab-env
      LAB_SERVER_NAME: scripted-agent

  # The verifier, run by the runner once per step with `docker compose run`.
  # It probes victims on tool-net and sees one host path: the run's verifier/
  # directory, where it writes its pins. The journals it is graded from stay
  # out of its reach. With no LAB_RUN_HOST_DIR the source does not exist and
  # the mount is refused, so a hand-run never mounts reports/.
  verifier:
    image: ${VERIFIER_IMAGE}:${VERIFIER_VERSION}
    # Built by `make verifier-image` alone, and never pulled: a registry image
    # under the pin's name is not the verifier the lock names, and an image
    # compose rebuilt after the runner checked it is not the image it checked.
    pull_policy: never
    <<: *hardened
    user: "65532:65532"
    networks: [tool-net]
    profiles: [verifier]
    volumes:
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-/LAB_RUN_HOST_DIR-is-unset}/verifier
        target: /lab-run
        bind:
          create_host_path: false

  # The verifier again, grading the agent's own trace against a scenario's
  # contract. It reads two files and calls nothing, so it reaches nothing: its
  # network holds it alone, and it writes nowhere the runner reads.
  trace-verifier:
    image: ${VERIFIER_IMAGE}:${VERIFIER_VERSION}
    pull_policy: never
    <<: *hardened
    user: "65532:65532"
    networks: [trace-net]
    profiles: [trace]
    volumes:
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-/LAB_RUN_HOST_DIR-is-unset}/verifier
        target: /lab-run
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LAB_WORKSPACE:-..}/config/contracts
        target: /contracts
        read_only: true
        bind:
          create_host_path: false

  # Where the enforcer's trail lands. Nothing else may reach it: a victim that
  # could post its own log records here could forge evidence, so it is the
  # only service on evidence-net and evidence-net carries nothing else (the
  # enforcer joins it once a service runs that image). It decides nothing and
  # holds no signing key, so a compromise of it forges no verdict, only the
  # record of one. It answers over TLS with the certificate the runner made for this run
  # (runner/collectortls.go), since the enforcer sends plaintext to a loopback
  # address only.
  collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    <<: *hardened
    command: ["--config=/etc/otelcol/config.yaml"]
    networks: [evidence-net]
    profiles: [enforcer]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-/LAB_RUN_HOST_DIR-is-unset}/collector
        target: /lab-run
        bind:
          create_host_path: false
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-/LAB_RUN_HOST_DIR-is-unset}/collector-tls
        target: /tls
        read_only: true
        bind:
          create_host_path: false

  # The proxy a chaos scenario sends one victim's traffic through, so a toxic
  # can slow or hold that victim's answers to the enforcer. It holds one proxy
  # per victim from the file it starts with; the runner points the enforcer's
  # upstream for a named victim at that proxy and leaves the rest direct. Its
  # control API listens on loopback inside the container and is driven only by
  # `compose exec`, so nothing on tool-net can add or lift a fault.
  toxiproxy-tools:
    image: ${TOXIPROXY_IMAGE}
    <<: *hardened
    user: "65532:65532"
    command: ["-host=127.0.0.1", "-config=/etc/toxiproxy/proxies.json"]
    networks: [tool-net]
    profiles: [chaos]
    volumes:
      - ./toxiproxy/proxies.json:/etc/toxiproxy/proxies.json:ro
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    depends_on:
      victim-crm: {condition: service_healthy}
      victim-db: {condition: service_healthy}
      victim-fs: {condition: service_healthy}
      victim-shell: {condition: service_healthy}
      victim-mail: {condition: service_healthy}
      victim-web: {condition: service_healthy}
      victim-pay: {condition: service_healthy}

  # The enforcement plane under test, from the image `make enforcer-image`
  # builds out of its pinned commit. The runner names it in LAB_ENFORCER_REF,
  # which is a development build only when it was asked for one. It is told nothing the lab decided about
  # a verdict: the runner hands it a bundle signed for the run and a
  # configuration assembled from the scenario's part (runner/gateway), both
  # read-only. It trusts two roots and no other: the decision point double's CA
  # in pki/, and in export-ca/ the CA the runner made for the collector.
  enforcer:
    image: ${LAB_ENFORCER_REF:-${ENFORCER_IMAGE}:${ENFORCER_COMMIT}}
    pull_policy: never
    <<: *hardened
    command: ["run", "--config", "/gateway/gateway.yaml"]
    # The agent listener binds this address alone (runner/gateway), so no
    # service on the enforcer's other networks can open a session at it.
    networks:
      agent-net:
        ipv4_address: ${LAB_ENFORCER_ADDRESS:-10.231.255.254}
      tool-net: {}
      evidence-net: {}
      pdp-net: {}
    profiles: [enforcer]
    environment:
      SSL_CERT_FILE: /pki/ca.pem
      SSL_CERT_DIR: /export-ca
    volumes:
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-/LAB_RUN_HOST_DIR-is-unset}/gateway
        target: /gateway
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-/LAB_RUN_HOST_DIR-is-unset}/pki
        target: /pki
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-/LAB_RUN_HOST_DIR-is-unset}/export-ca
        target: /export-ca
        read_only: true
        bind:
          create_host_path: false
      - spool:/var/lib/lab/spool
      - approvals:/var/lib/lab/approvals
      - holds:/var/lib/lab/holds
    # /brand rather than /healthz: a plane that takes no material call, as
    # under LOCKDOWN, answers /healthz 503 and is still up.
    healthcheck:
      test: ["CMD", "/healthprobe", "http://127.0.0.1:8081/brand"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    depends_on:
      victim-crm: {condition: service_healthy}
      victim-db: {condition: service_healthy}
      victim-fs: {condition: service_healthy}
      victim-shell: {condition: service_healthy}
      victim-mail: {condition: service_healthy}
      victim-web: {condition: service_healthy}
      victim-pay: {condition: service_healthy}
      collector: {condition: service_started}
      pdp-double: {condition: service_healthy, required: false}
      toxiproxy-tools: {condition: service_healthy, required: false}

  # The external decision point double (services/pdp-double), on a network
  # it shares with the enforcer alone. It makes its CA in memory and writes
  # only the CA certificate, into the run's pki/ directory.
  pdp-double:
    image: ${LAB_IMAGE_PREFIX}-pdp-double
    <<: *hardened
    build:
      context: ..
      dockerfile: compose/Dockerfile.go-service
      args:
        <<: *build-args
        TARGET: ./services/pdp-double
    command:
      - -identifier=https://pdp-double:8443
      - -san=pdp-double
      - -ca-out=/pki/ca.pem
      - -script=/scripts/${LAB_PDP_SCRIPT:-no-script-given.yaml}
    networks: [pdp-net]
    profiles: [pdp]
    environment:
      <<: *lab-env
    volumes:
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-../reports/manual}/journals/pdp-double
        target: /reports/${LAB_RUN_ID:-manual}/journals
        bind:
          create_host_path: false
      - type: bind
        source: ${LAB_WORKSPACE:-..}/config/pdp
        target: /scripts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-/LAB_RUN_HOST_DIR-is-unset}/pki
        target: /pki
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/healthprobe", "-ca", "/pki/ca.pem", "https://pdp-double:8443/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  # The approver (services/approver): answers held approvals through the
  # enforcer's own command, on the approvals volume it shares with the plane
  # alone. Its network holds nothing else and has no route out.
  approver:
    image: ${LAB_IMAGE_PREFIX}-approver:${LAB_ENFORCER_TAG:-${ENFORCER_COMMIT}}
    <<: *hardened
    build:
      context: ..
      dockerfile: compose/Dockerfile.approver
      args:
        <<: *build-args
        ENFORCER_REF: ${LAB_ENFORCER_REF:-${ENFORCER_IMAGE}:${ENFORCER_COMMIT}}
    command:
      - -dir=/var/lib/lab/approvals
      - -script=/scripts/${LAB_APPROVER_SCRIPT:-no-script-given.yaml}
    networks: [approver-net]
    profiles: [approvals]
    restart: "no"
    environment:
      <<: *lab-env
    volumes:
      - type: bind
        source: ${LAB_RUN_HOST_DIR:-../reports/manual}/journals/approver
        target: /reports/${LAB_RUN_ID:-manual}/journals
        bind:
          create_host_path: false
      - type: bind
        source: ${LAB_WORKSPACE:-..}/config/approver
        target: /scripts
        read_only: true
        bind:
          create_host_path: false
      - approvals:/var/lib/lab/approvals
    healthcheck:
      test: ["CMD", "/healthprobe", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    depends_on:
      enforcer: {condition: service_healthy}

volumes:
  # The plane's own directories. Each starts as a copy of the image's, owned by
  # nonroot with mode 0700, and goes with the run's compose project.
  spool:
  approvals:
  holds:

networks:
  # Every network is sealed. The agent replays the attack payloads, so it is
  # the last thing in the lab that should be able to reach anything outside it:
  # an exfiltration that succeeded would be one no scenario could grade. Nothing
  # needs a route out at run time — images are pulled and built over the host's
  # network before any container starts (the runner builds every image of the
  # profile, the agent's included, before it brings anything up), and the agent
  # talks only to the gateway.
  # The runner gives each run its own subnet (runner/env.go), so parallel runs
  # do not share one; docker refuses a subnet already in use and that run's
  # boot fails. Docker hands the lower half out; the enforcer's address is in
  # the upper half. The defaults are a lab brought up by hand.
  agent-net:
    internal: true
    ipam:
      config:
        - subnet: ${LAB_AGENT_SUBNET:-10.231.255.224/27}
          ip_range: ${LAB_AGENT_RANGE:-10.231.255.224/28}
  tool-net:
    # No route out, for anything, ever. The attack payloads and the canary
    # tokens live behind this line.
    internal: true
  evidence-net:
    # Sealed the same way, for the opposite reason: nothing on it should ever
    # need a route out, because the only thing meant to reach it is the
    # enforcer posting its own trail.
    internal: true
  # The enforcer and the decision point double, nothing else.
  pdp-net:
    internal: true
  # The approver alone: it needs no peer, only the volume, and a service with
  # no network would be put on the project's default one, which has a route out.
  approver-net:
    internal: true
  # The trace verifier alone, for the same reason.
  trace-net:
    internal: true
